name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_native
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_native"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agent_native
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Migrate PostgreSQL
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$PWD/infra/compose/migrate.sql:/migrate.sql:ro" \
            -v "$PWD/infra/compose/002-auditability.sql:/auditability.sql:ro" \
            postgres:17-alpine \
            sh -ec 'psql -h 127.0.0.1 -U postgres -d agent_native -v ON_ERROR_STOP=1 -f /migrate.sql && psql -h 127.0.0.1 -U postgres -d agent_native -v ON_ERROR_STOP=1 -f /auditability.sql'
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck API
        run: pnpm --filter @agent-native/api typecheck
      - name: Build API boundary
        run: pnpm --filter @agent-native/api build
      - name: Verify deployment boundary
        run: pnpm exec vitest run packages/deployment-boundary apps/api
      - name: Benchmark hard gate
        id: benchmark
        run: |
          rm -f artifacts/benchmark-results.json
          pnpm exec vitest run packages/benchmark/src/benchmark-smoke.test.ts
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('artifacts/benchmark-results.json', 'utf8'));
          if (report.schemaVersion !== 1) throw new Error(`Unexpected benchmark schemaVersion: ${report.schemaVersion}`);
          if (report.summary.total !== 64 || report.summary.passed !== 64 || report.summary.failed !== 0) {
            throw new Error(`Benchmark hard gate failed: ${JSON.stringify(report.summary)}`);
          }
          if (report.results.some((result) => result.passed !== true || (result.invariantViolations?.length ?? 0) !== 0)) {
            throw new Error('Benchmark hard gate failed: at least one scenario has invariant violations');
          }
          console.log(`Benchmark hard gate passed: ${report.summary.total}/${report.summary.total}`);
          NODE
      - name: Upload benchmark report
        if: steps.benchmark.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: artifacts/benchmark-results.json
          if-no-files-found: error
      - name: Failure and SLO benchmark gate
        run: pnpm exec vitest run packages/benchmark/src/failure-slo-benchmark.test.ts
      - name: Test
        id: test
        run: pnpm test

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate Compose configuration
        run: docker compose config
      - name: Start local environment
        run: docker compose up --build -d
      - name: Wait for benchmark smoke test
        run: docker compose wait benchmark
      - name: Show service logs
        if: always()
        run: docker compose logs --no-color benchmark worker migrate
      - name: Assert benchmark smoke test succeeded
        if: always()
        run: test "$(docker inspect "$(docker compose ps -aq benchmark)" --format '{{.State.ExitCode}}')" = "0"
      - name: Assert worker smoke test succeeded
        if: always()
        run: test "$(docker inspect "$(docker compose ps -aq worker)" --format '{{.State.ExitCode}}')" = "0"
      - name: Assert migration succeeded
        if: always()
        run: test "$(docker inspect "$(docker compose ps -aq migrate)" --format '{{.State.ExitCode}}')" = "0"
      - name: Show service status
        if: always()
        run: docker compose ps -a
      - name: Tear down local environment
        if: always()
        run: docker compose down -v
