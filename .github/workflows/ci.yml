name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_native
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_native"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agent_native
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck API
        run: pnpm --filter @agent-native/api typecheck
      - name: Build API boundary
        run: pnpm --filter @agent-native/api build
      - name: Verify deployment boundary
        run: pnpm exec vitest run packages/deployment-boundary apps/api
      - name: Test
        run: pnpm test

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config
      - name: Start local environment
        run: docker compose up --build -d
      - name: Wait for benchmark smoke test
        run: docker compose wait benchmark
      - name: Show service logs
        if: always()
        run: docker compose logs --no-color benchmark worker migrate
      - name: Assert benchmark smoke test succeeded
        if: always()
        run: test "$(docker inspect "$(docker compose ps -aq benchmark)" --format '{{.State.ExitCode}}')" = "0"
      - name: Assert worker smoke test succeeded
        if: always()
        run: test "$(docker inspect "$(docker compose ps -aq worker)" --format '{{.State.ExitCode}}')" = "0"
      - name: Assert migration succeeded
        if: always()
        run: test "$(docker inspect "$(docker compose ps -aq migrate)" --format '{{.State.ExitCode}}')" = "0"
      - name: Show service status
        if: always()
        run: docker compose ps -a
      - name: Tear down local environment
        if: always()
        run: docker compose down -v
